blueprint:
  name: Motion Light with Scene Restore
  description: >
    When there is no motion, saves the state of all selected light sources
    into a temporary scene and turns them off. When motion is detected,
    restores the saved scene and deletes it. If there is no saved scene,
    simply turns the sources on using their own device settings.
  domain: automation
  input:
    motion_sensor:
      name: Motion sensor
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class:
                - motion
                - occupancy
                - presence
    lights:
      name: Light sources
      selector:
        entity:
          multiple: true
          filter:
            - domain:
                - light
                - switch
    no_motion_wait:
      name: No-motion delay
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration:

mode: restart

variables:
  lights: !input lights
  scene_id: "motion_snapshot_{{ this.entity_id.split('.')[1] }}"
  scene_entity: "scene.{{ scene_id }}"

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_on
  - trigger: state
    entity_id: !input motion_sensor
    to: "off"
    for: !input no_motion_wait
    id: motion_off

actions:
  - choose:
      - alias: Motion - restore the scene
        conditions:
          - condition: trigger
            id: motion_on
        sequence:
          - choose:
              - alias: Saved scene exists - restore and delete it
                conditions:
                  - condition: template
                    value_template: "{{ expand(scene_entity) | count > 0 }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ scene_entity }}"
                  - action: scene.delete
                    target:
                      entity_id: "{{ scene_entity }}"
            default:
              - alias: No scene - turn on with device defaults
                action: homeassistant.turn_on
                target:
                  entity_id: "{{ lights }}"

      - alias: No motion - save state and turn off
        conditions:
          - condition: trigger
            id: motion_off
          - alias: At least one light source is on
            condition: template
            value_template: >
              {{ expand(lights) | selectattr('state', 'eq', 'on') | list | count > 0 }}
        sequence:
          - alias: Save state without the effect attribute
            action: scene.create
            data:
              scene_id: "{{ scene_id }}"
              snapshot_entities: "{{ lights | reject('match', 'light\\.') | list }}"
              entities: >-
                {%- set ns = namespace(d={}) -%}
                {%- for e in expand(lights) | selectattr('domain', 'eq', 'light') -%}
                  {%- set a = e.attributes -%}
                  {%- set mode = a.get('color_mode') -%}
                  {%- set item = {'state': e.state} -%}
                  {%- if e.state == 'on' -%}
                    {%- if a.get('brightness') is not none -%}
                      {%- set item = item | combine({'brightness': a.get('brightness')}) -%}
                    {%- endif -%}
                    {%- if mode is not none -%}
                      {%- set item = item | combine({'color_mode': mode}) -%}
                    {%- endif -%}
                    {%- set keys = {'color_temp': 'color_temp_kelvin', 'hs': 'hs_color', 'rgb': 'rgb_color', 'xy': 'xy_color', 'rgbw': 'rgbw_color', 'rgbww': 'rgbww_color'} -%}
                    {%- if mode in keys and a.get(keys[mode]) is not none -%}
                      {%- set item = item | combine({keys[mode]: a.get(keys[mode])}) -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- set ns.d = ns.d | combine({e.entity_id: item}) -%}
                {%- endfor -%}
                {{ ns.d }}
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ lights }}"
